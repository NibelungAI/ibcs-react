name: Release

# Changesets release automation — publishes via npm TRUSTED PUBLISHING (OIDC).
# There is deliberately NO NPM_TOKEN secret: npm accepts publishes coming from
# exactly this workflow file in this repo (verified via GitHub's OIDC identity)
# and attaches provenance attestations automatically.
#
# SETUP (one-time, by a maintainer):
#   1. npmjs.com → package `ibcs-react` → Settings → Trusted Publisher →
#      GitHub Actions: org `NibelungAI`, repository `ibcs-react`, workflow
#      filename `release.yml`, no environment; allowed actions: npm publish.
#      Recommended afterwards: Publishing access → "Require two-factor
#      authentication and disallow tokens" — OIDC publishes keep working.
#   2. Settings → Actions → General → Workflow permissions: allow GitHub Actions
#      to **create and approve pull requests** (the action opens the "Version
#      Packages" PR on your behalf; the org-level setting gates the repo one).
#
# HOW IT WORKS:
#   - Every user-facing PR adds a changeset (`npx changeset`) describing the
#     bump. On merge to `main` this workflow opens/updates a "Version Packages"
#     PR that consumes the pending changesets, bumps the version and writes
#     CHANGELOG.md.
#   - Merging that PR runs this workflow again; with no changesets left, the
#     action runs the publish command and pushes the git tag + GitHub release.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # commit the version bump, push tags, create the release
  pull-requests: write # open / update the "Version Packages" PR
  id-token: write # mint the OIDC token npm exchanges for a publish credential

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets needs the full history to work out what changed.
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Required for OIDC publishing — without it npm never attempts the
          # token exchange against the registry.
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10. Pinned
      # to major 11 — NOT @latest: npm 12 changed `npm info --json` to emit an
      # array, which breaks changesets' published-version check (it reads
      # `.versions` off an object, gets undefined, concludes the current
      # version is unpublished and re-publishes it — the registry then rejects
      # with "cannot publish over previously published versions").
      - name: Update npm (OIDC publish support)
        run: npm install -g npm@11

      - run: npm ci

      # Gate the release on the same chain CI runs: typecheck, tests, build and
      # the dist smoke test. `prepublishOnly` re-runs it during `npm publish`
      # as a belt-and-braces guard, but failing here means we never even open
      # the version PR with a broken tree.
      - name: Verify (typecheck, test, build, dist smoke)
        run: npm run ci

      - name: Create version PR or publish to npm
        uses: changesets/action@v1
        with:
          # Bump versions + regenerate CHANGELOG.md, and keep the lockfile in
          # sync with the new version so `npm ci` stays reproducible.
          version: npx changeset version && npm install --package-lock-only
          publish: npx changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
