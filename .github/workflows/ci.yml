name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 / 24 — the maintained LTS lines. Node 20 went EOL in April 2026
        # and the build toolchain (tsdown/rolldown) requires >= 22.18 — on 20
        # it cannot even load its config (the native TS loader is missing and
        # the `unrun` fallback isn't installed). The PACKAGE still declares
        # `engines.node >= 18`: dist is plain transpiled JS — the matrix here
        # gates the toolchain, not consumers. setup-node resolves the latest
        # minor of each major, which satisfies tsdown's ^22.18.
        node: [22, 24]
    name: verify (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4

      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (ESM + CJS + types)
        run: npm run build

      # Smoke-tests the artifact consumers actually install: both formats load,
      # the entries share one instance (no dual-package hazard), the dist is
      # per-module, and "use client" is stamped on the react modules only.
      - name: Verify dist
        run: npm run verify-dist

      # Bundles a KpiCard-only fixture against dist the way a consumer's
      # bundler would and fails if tree-shaking regresses (size budget +
      # foreign-component markers). One KpiCard must cost ~4 KB gzip, not the
      # whole library.
      - name: Verify tree-shaking
        run: npm run verify-treeshake

      # Packaging lint: exports map, file extensions, types resolution. Node
      # version independent, so one leg is enough.
      - name: publint
        if: matrix.node == 22
        run: npx --yes publint

      # "Are the types wrong?" — checks the ESM/CJS type conditions resolve for
      # every module resolution mode a consumer might use.
      - name: Check type resolution (attw)
        if: matrix.node == 22
        run: npx --yes @arethetypeswrong/cli --pack .

      # Formatting last, and on one leg: it is the cheapest signal and the least
      # interesting failure, so it must not mask a real test/build error.
      # `npm run format` fixes what you touched; `npm run format:all` sweeps the
      # whole repo (needed once after an oxfmt upgrade changes its output).
      - name: Check formatting
        if: matrix.node == 22
        run: npm run check-format
