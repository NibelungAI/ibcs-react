<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ibcs-react — IBCS / ISO 24896 components</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      /* Reserve the scrollbar gutter so opening any dropdown/overlay that toggles
         body overflow never shifts the centered layout sideways. */
      html {
        scrollbar-gutter: stable;
      }
      /* overflow-x: clip (not hidden) — clips sideways bleed WITHOUT creating a
         scroll container, so descendant position:sticky (the docs sidebar) keeps working. */
      html,
      body {
        margin: 0;
        background: #faf9f6;
        color: #2b2b29;
        overflow-x: clip;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      #root {
        min-height: 100vh;
        max-width: 100%;
        overflow-x: clip;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/demo/main.tsx"></script>
  </body>
</html>
